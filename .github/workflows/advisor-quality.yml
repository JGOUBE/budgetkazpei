name: Conseiller FR-Kreol regression

on:
  push:
    branches:
      - feat/advisor-intelligence-fr-kreol-20261120
  pull_request:
    paths:
      - ".github/workflows/advisor-quality.yml"
      - "src/services/advisorQuestionRouter.js"
      - "src/services/ai/**"
      - "supabase/functions/assistant-aisupabase/**"
      - "scripts/run-advisor-*.mjs"
      - "scripts/run-assistant-tests.mjs"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: conseiller-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Conseiller budget / aides / questions libres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tests Conseiller Premium sans appel OpenAI
        run: |
          npm run test:advisor-intelligence
          npm run test:advisor-diverse
          npm run test:advisor-kreol-parity
          npm run test:advisor-spend-guard
          npm run test:advisor-ai-cost
          npm run test:advisor-aides
          npm run test:advisor-aide-quality
          npm test
      - name: Build complet sans déploiement
        run: npm run build
