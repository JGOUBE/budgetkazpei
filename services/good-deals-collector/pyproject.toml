[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetkazpei-good-deals-collector"
version = "0.1.0"
description = "BudgetKazPei isolated good deals collector job"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "pypdf==6.1.3",
  "pdfplumber==0.11.7",
  "pymupdf==1.26.5",
  "rapidocr==3.9.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
