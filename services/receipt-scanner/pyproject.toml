[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetkazpei-receipt-scanner"
version = "0.1.0"
description = "BudgetKazPei Python receipt scanner engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.1",
  "opencv-python-headless==5.0.0.93",
  "onnxruntime==1.27.0",
  "pillow==12.3.0",
  "rapidocr==3.9.1",
]

[project.scripts]
receipt-scanner-smoke = "receipt_scanner.smoke:main"

[tool.setuptools]
packages = ["receipt_scanner"]
