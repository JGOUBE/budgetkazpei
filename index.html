    <link rel="icon" type="image/png" href="/budgetkazpei-favicon.png?v=4" />
    <link rel="apple-touch-icon" href="/budgetkazpei-apple-touch.png?v=4" />
    <link rel="manifest" href="/manifest.webmanifest?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <script>
      // BudgetKazPeï ne propose qu'un thème clair, y compris au tout premier affichage.
      (function () {
        document.documentElement.dataset.theme = "light";
        document.documentElement.style.colorScheme = "light";
        try {
          localStorage.setItem("budgetkazpei:theme", "light");
        } catch (error) {
          // Le thème clair fonctionne même si le stockage local est indisponible.
        }
        var vars = {
          "--bkp-bg": "#EEE9E3",
          "--bkp-page-bg": "#EEE9E3",
          "--bkp-card": "#FFFFFF",
          "--bkp-card-hover": "#FAF8F4",
          "--bkp-border": "#D6C8BA",
          "--bkp-text": "#332B26",
          "--bkp-muted": "#55483E",
          "--bkp-input": "#FFFFFF",
          "--bkp-input-text": "#332B26",
          "--bkp-cyan": "#396C64"
        };
        Object.keys(vars).forEach(function (key) {
          document.documentElement.style.setProperty(key, vars[key]);
        });
      })();
    </script>

    <meta
      name="description"
      content="Suivez votre budget, comprenez vos courses, préparez vos démarches et découvrez progressivement les bons plans locaux avec BudgetKazPéi."
    />
    <meta property="og:title" content="BudgetKazPéi - Budget, courses, aides et bons plans à La Réunion" />
    <meta
      property="og:description"
      content="Une application locale pour réunir budget, courses, aides, démarches et solutions utiles autour de vous."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons-creole/logo-budgetkazpei.png" />
    <title>BudgetKazPéi — Budget, courses, aides et bons plans à La Réunion</title>
  </head>

  </body>
</html>
